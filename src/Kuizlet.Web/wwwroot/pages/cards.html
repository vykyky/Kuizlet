<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Set - Kuizlet</title>
    <link rel="stylesheet" href="../css/cards.css">
</head>
<body>

<header>       
    <button class="back-btn" onclick="window.location.href='dashboard.html'">← Back to Dashboard</button>
</header>
<div class="container">
    <!-- Блок 2: Карточка -->
    <div class="card-block">
        <h1 id="cardSetName">Loading...</h1>
        <div class="card-container">
            <div class="card" onclick="flipCard()">
                <div class="card-front" id="cardFront">Loading...</div>
                <div class="card-back" id="cardBack">Loading...</div>
            </div>
        </div>
        <div class="navigation">
            <button onclick="showPreviousCard()">◄</button>
            <span class="card-counter" id="cardCounter">0/0</span>
            <button onclick="showNextCard()">►</button>
        </div>
        <p id="noCardsMessage">No cards found. Add some cards to get started!</p>
    </div>
    
    <div class="buttons-block">
        <div class="dropdown">
            <div class="add-card-btn">
                <button class="edit" onclick="navigateToViewCards()">Edit Cards</button>
                <button class="edit-card-set-btn" onclick="openEditCardSetModal()">Edit Card Set</button>
                <button class="delete" onclick="deleteCardSet()">Delete Card Set</button>
            </div>
        </div>
    </div>
</div>

<div id="editCardSetModal" class="modal">
    <div class="modal-content">
        <h3>Edit Card Set</h3>
        <input type="text" id="editCardSetName" placeholder="Card Set Name">
        <div class="checkbox-container">
            <label for="editIsPublic">Public</label>
            <input type="checkbox" id="editIsPublic">
        </div>
        <button onclick="updateCardSet()">Save Changes</button>
        <button class="cancel" onclick="closeEditCardSetModal()">Cancel</button>
    </div>
</div>

<!-- Add Card Modal -->
<div id="addCardModal" class="modal">
    <div class="modal-content">
        <h3>Add New Card</h3>
        <textarea id="addFrontText" placeholder="Front of the card"></textarea>
        <textarea id="addBackText" placeholder="Back of the card"></textarea>
        <button onclick="addCard()">Add Card</button>
        <button class="cancel" onclick="closeAddCardModal()">Cancel</button>
    </div>
</div>

<script src="../js/cards.js"></script>

</body>
</html>
