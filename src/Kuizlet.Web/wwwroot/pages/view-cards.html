<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View All Cards - Kuizlet</title>
    <link rel="stylesheet" href="../css/view-cards.css">
    <style>
        
    </style>
</head>
<body>
<div class="header">
    <button class="back-btn" onclick="back()">← Back to Cards</button>
</div>

<div class="container">
    <h2>All Cards</h2>
    <button class="add-card-btn" onclick="openAddCardModal()">➕ Add Card</button>
    <div class="card-list" id="cardList"></div>
</div>

<!-- Edit Card Modal -->
<div id="editCardModal" class="modal">
    <div class="modal-content">
        <h3>Edit Card</h3>
        <input id="editFrontText" placeholder="Term"></input>
        <input id="editBackText" placeholder="Definition"></input>
        <button onclick="updateCard()">Update</button>
        <button class="cancel" onclick="closeEditModal()">Cancel</button>
    </div>
</div>

<div id="addCardModal" class="modal">
    <div class="modal-content">
        <h3>Add New Card</h3>
        <input type="text" id="termInput" placeholder="Enter term">
        <input type="text" id="definitionInput" placeholder="Enter definition">
        <button onclick="addCard()">Add Card</button>
        <button class="cancel" onclick="closeAddCardModal()">Cancel</button>
    </div>
</div>
<script src="../js/view-cards.js"></script> 
</body>
</html>
